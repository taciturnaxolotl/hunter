name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
      - name: test
        run: go test ./...
      - name: guard hook
        run: hooks/test_guard.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build every platform
        run: VERSION="0.0.0-${GITHUB_SHA::7}" ./package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hunter-${{ github.sha }}
          path: dist/release/*
          retention-days: 14
